<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또또에게 온 편지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap">
<style>
:root{--night:#14173a;--dusk:#3a3270;--wall:#241a36;--frame:#5a3f63;--wood:#7a5240;--paper:#fbf3e4;--ink:#3b2f3f;--rose:#d4577a;--amber:#ffcf70;--lav:#b9b5d3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--paper);font-family:'Gaegu','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:20px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wall);z-index:10}
.stage{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at 50% 30%,#3b2a4d 0%,var(--wall) 70%)}
.win{position:relative;width:min(84vw,400px);height:min(52dvh,430px);margin:5dvh auto 0;perspective:900px}
.glass{position:absolute;inset:0;border:10px solid var(--frame);border-radius:200px 200px 6px 6px;overflow:hidden;background:linear-gradient(#0d1030 0%,#262a66 55%,#6a4f93 100%);box-shadow:0 0 60px rgba(255,207,112,.12) inset}
.glass::before,.glass::after{content:"";position:absolute;background:var(--frame);z-index:2}
.glass::before{left:50%;top:0;bottom:0;width:6px;margin-left:-3px}
.glass::after{top:55%;left:0;right:0;height:6px}
.moon{position:absolute;right:16%;top:14%;width:44px;height:44px;border-radius:50%;background:#fff4cf;box-shadow:0 0 30px 8px rgba(255,244,207,.4)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.shutter{position:absolute;top:0;bottom:0;width:50%;z-index:3;background:repeating-linear-gradient(#7a5240 0 14px,#5f3f31 14px 17px);border:6px solid #4a3126;transition:transform 1.8s cubic-bezier(.5,0,.2,1)}
.shutter.l{left:0;transform-origin:left center;border-radius:200px 0 0 6px}
.shutter.r{right:0;transform-origin:right center;border-radius:0 200px 6px 0}
.open .shutter.l{transform:rotateY(-105deg)}
.open .shutter.r{transform:rotateY(105deg)}
.sill{position:absolute;left:-14px;right:-14px;bottom:-22px;height:22px;border-radius:4px;background:linear-gradient(#8a6a73,#5a3f63);box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:1}
.bird{position:absolute;left:0;top:0;width:110px;height:82px;z-index:5;opacity:0;transform-origin:0 0}
.bird svg{width:100%;height:100%;overflow:visible}
.wing{transform-box:fill-box;transform-origin:30% 80%;animation:flap .28s infinite alternate ease-in-out}
@keyframes flap{from{transform:rotate(-38deg)}to{transform:rotate(22deg)}}
.landed .wing{animation:none;transform:rotate(4deg)}
.legs{opacity:0}.landed .legs{opacity:1}
.coo{position:absolute;left:-6px;top:-26px;font-family:'Jua',sans-serif;font-size:18px;color:var(--paper);opacity:0;white-space:nowrap}
.landed .coo{animation:coo 2.4s .3s both}
@keyframes coo{0%{opacity:0;transform:translateY(6px)}20%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.letter{position:absolute;left:0;top:0;width:132px;height:92px;border:0;padding:0;z-index:6;cursor:default;background:var(--paper);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.45);transform-origin:center;opacity:0}
.letter::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,#e8dcc4 50%) top left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49%,#e8dcc4 50%) top right/50% 100% no-repeat;border-radius:6px}
.letter::after{content:"♥";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--rose);color:#fff;font-size:20px;line-height:34px;text-align:center}
.letter.ready{cursor:pointer;animation:wig 1.6s infinite ease-in-out}
@keyframes wig{0%,100%{rotate:0deg;scale:1}25%{rotate:-4deg;scale:1.04}75%{rotate:4deg;scale:1.04}}
.hint{position:absolute;left:0;right:0;text-align:center;font-family:'Jua',sans-serif;font-size:20px;color:var(--amber);opacity:0;transition:opacity .6s}
.hint.on{opacity:1}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,30,.72);backdrop-filter:blur(4px)}
.card{width:min(100%,380px);max-height:92dvh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:unfold .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes unfold{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
h2{font-family:'Jua',sans-serif;font-weight:400;font-size:27px;line-height:1.3;margin:0 0 6px}
.msg{min-height:2.6em;margin:6px 0 16px;font-size:21px;line-height:1.35}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{font-family:'Jua',sans-serif;font-size:22px;border-radius:14px;border:2px solid var(--rose);padding:10px 26px;cursor:pointer;background:transparent;color:var(--rose);transition:transform .2s,left .25s,top .25s}
.btn.pri{background:var(--rose);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid #2b6fd6;outline-offset:2px}
.no.run{position:fixed;z-index:30}
label{display:block;text-align:left;font-weight:700;margin:12px 0 4px}
input{width:100%;font:inherit;font-size:22px;color:#222;color-scheme:light;background:#fff;border:2px solid #cdbfae;border-radius:12px;padding:8px 12px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.chip{font:inherit;font-size:20px;line-height:1.2;color:var(--ink);background:#fff;border:2px solid #cdbfae;border-radius:14px;padding:12px 8px;cursor:pointer;transition:transform .15s,background .15s}
.chip .e{display:block;font-size:30px;margin-bottom:4px}
.chip[aria-pressed=true]{background:#ffe1ea;border-color:var(--rose);transform:scale(1.04)}
.final{background:radial-gradient(ellipse at 50% 40%,rgba(212,87,122,.55),rgba(20,23,58,.92) 70%);flex-direction:column;text-align:center;gap:18px}
.final h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(34px,9.5vw,66px);line-height:1.25;margin:0;color:#fff4f6;text-shadow:0 4px 24px rgba(0,0,0,.45);animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
.final .h{display:inline-block;color:#ff7a9c;animation:beat 1.1s infinite}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes beat{50%{transform:scale(1.3)}}
.sum{background:rgba(251,243,228,.95);color:var(--ink);border-radius:16px;padding:12px 20px;font-size:21px;line-height:1.5;animation:unfold .6s .5s both}
.final .btn{font-size:19px;padding:8px 20px;color:#fff;border-color:#fff;animation:unfold .6s .8s both}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){.star,.wing,.letter.ready,.final .h{animation:none}.shutter{transition-duration:.01s}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="win" id="win">
    <div class="glass"><div class="moon"></div><div id="stars"></div></div>
    <div class="shutter l"></div><div class="shutter r"></div>
    <div class="sill" id="sill"></div>
  </div>
  <div class="bird" id="bird" aria-hidden="true">
    <div class="coo">구구~ 💌</div>
    <svg viewBox="0 0 120 90">
      <g class="legs" stroke="#e9899a" stroke-width="3" stroke-linecap="round"><path d="M52 66v18M68 66v18M46 85h12M62 85h12"/></g>
      <polygon points="92,46 118,38 118,60 92,58" fill="#8f8ab3"/>
      <ellipse cx="60" cy="50" rx="35" ry="20" fill="#b9b5d3"/>
      <ellipse cx="46" cy="58" rx="20" ry="11" fill="#d9d6ea"/>
      <circle cx="26" cy="40" r="13" fill="#a7a2c7"/>
      <path d="M17 49c6 5 16 5 22 0" stroke="#7fd1c3" stroke-width="4" fill="none" stroke-linecap="round"/>
      <polygon points="14,38 3,42 14,46" fill="#f2b36a"/>
      <circle cx="22" cy="37" r="2.6" fill="#2a2140"/><circle cx="21.2" cy="36.2" r=".8" fill="#fff"/>
      <path class="wing" d="M48 46C56 8 96 4 112 14 94 22 86 38 74 54Z" fill="#8f8ab3"/>
    </svg>
  </div>
  <button class="letter" id="letter" aria-label="편지 열기"></button>
  <div class="hint" id="hint">편지가 도착했어요. 눌러보세요!</div>
</div>

<script>
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const k=reduce?0.01:1;
const stage=$('#stage'),bird=$('#bird'),letter=$('#letter'),hint=$('#hint');
const state={date:'',time:'',picks:[]};

for(let i=0;i<36;i++){const s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*80+'%';s.style.animationDelay=(Math.random()*3)+'s';$('#stars').appendChild(s)}

function layout(){
  const w=$('#win').getBoundingClientRect(),s=$('#sill').getBoundingClientRect();
  return {w,s,bw:bird.offsetWidth,bh:bird.offsetHeight};
}
function letterTarget(){
  const {s}=layout();
  return {x:innerWidth/2-66,y:Math.min(s.bottom+60,innerHeight-130)-46};
}

function start(){
  setTimeout(()=>$('#win').classList.add('open'),500*k);
  setTimeout(flyIn,2300*k);
}
function flyIn(){
  const {w,s,bw,bh}=layout();
  const lx=s.left+s.width*0.34-bw/2, ly=s.top-bh+8;
  const sx=w.left+w.width*0.78, sy=w.top+w.height*0.18;
  bird.style.opacity=1;
  const a=bird.animate([
    {transform:`translate(${sx}px,${sy}px) scale(.2) rotate(6deg)`},
    {transform:`translate(${w.left+w.width*0.5}px,${w.top+w.height*0.12}px) scale(.55) rotate(-4deg)`,offset:.45},
    {transform:`translate(${lx+40}px,${ly-60}px) scale(.95) rotate(-14deg)`,offset:.85},
    {transform:`translate(${lx}px,${ly}px) scale(1) rotate(0deg)`}
  ],{duration:3400*k,easing:'ease-in-out',fill:'forwards'});
  const l=bird; l.appendChild(letter);
  letter.style.cssText='opacity:1;left:-8px;top:34px;width:44px;height:31px;transform:rotate(-12deg)';
  a.onfinish=()=>{bird.classList.add('landed');setTimeout(drop,700*k)};
}
function drop(){
  const r=letter.getBoundingClientRect();
  stage.appendChild(letter);
  letter.style.cssText='opacity:1;left:0;top:0';
  const t=letterTarget();
  const cx=r.left+r.width/2-66, cy=r.top+r.height/2-46;
  const sc=r.width/132;
  const a=letter.animate([
    {transform:`translate(${cx}px,${cy}px) scale(${sc}) rotate(-12deg)`},
    {transform:`translate(${cx-26}px,${cy+(t.y-cy)*.3}px) scale(${sc+.3}) rotate(24deg)`,offset:.3},
    {transform:`translate(${cx+14}px,${cy+(t.y-cy)*.62}px) scale(.8) rotate(-16deg)`,offset:.62},
    {transform:`translate(${t.x}px,${t.y-8}px) scale(1) rotate(5deg)`,offset:.85},
    {transform:`translate(${t.x}px,${t.y}px) scale(1) rotate(0deg)`}
  ],{duration:2200*k,easing:'ease-in-out',fill:'forwards'});
  a.onfinish=()=>{
    letter.style.transform=`translate(${t.x}px,${t.y}px)`;
    a.cancel();letter.style.transform=`translate(${t.x}px,${t.y}px)`;
    letter.classList.add('ready');letter.style.cursor='pointer';
    hint.style.top=(t.y+104)+'px';hint.classList.add('on');
  };
}
letter.addEventListener('click',()=>{if(letter.classList.contains('ready'))ask()});
addEventListener('resize',()=>{if(letter.classList.contains('ready')){const t=letterTarget();letter.style.transform=`translate(${t.x}px,${t.y}px)`;hint.style.top=(t.y+104)+'px'}});

/* ---------- dialog ---------- */
let ov;
function card(html){
  if(!ov){ov=document.createElement('div');ov.className='overlay';document.body.appendChild(ov)}
  ov.innerHTML='<div class="card" role="dialog" aria-live="polite">'+html+'</div>';
  return ov.firstChild;
}

const nos=['정말요? 🥺','다시 생각해줘요…','한 번만 더 생각해봐요!','비둘기가 날개 아프게 날아왔는데… 🕊️','아니오 버튼이 도망가요 💨','눌러도 안 눌려요~','그냥 “예” 누르는 게 빨라요 ♥'];
function ask(){
  const c=card('<h2>이 편지를<br>열어보시겠습니까?</h2><p class="msg" id="msg">💌</p><div class="row"><button class="btn pri" id="yes">예</button><button class="btn no" id="no">아니오</button></div>');
  let n=0;const yes=$('#yes'),no=$('#no');
  yes.onclick=pickDate;
  function dodge(e){
    e&&e.preventDefault();
    if(!no.classList.contains('run')){
      const r=no.getBoundingClientRect(),sp=document.createElement('span');
      sp.style.cssText=`display:inline-block;width:${r.width}px;height:${r.height}px`;
      no.before(sp);ov.appendChild(no);no.classList.add('run');
      no.style.left=r.left+'px';no.style.top=r.top+'px';
    }
    $('#msg').textContent=nos[Math.min(n,nos.length-1)];n++;
    yes.style.transform=`scale(${Math.min(1+n*.1,1.8)})`;
    const yr=yes.getBoundingClientRect(),W=no.offsetWidth,H=no.offsetHeight;
    let x,y,i=0;
    do{x=12+Math.random()*(innerWidth-W-24);y=12+Math.random()*(innerHeight-H-24);i++}
    while(i<30&&x<yr.right+24&&x+W>yr.left-24&&y<yr.bottom+24&&y+H>yr.top-24);
    no.style.left=x+'px';no.style.top=y+'px';
  }
  ['pointerenter','pointerdown','click','focus'].forEach(ev=>no.addEventListener(ev,dodge));
  yes.focus({preventScroll:true});
}

function pickDate(){
  const d=new Date(),min=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const c=card(`<h2>언제 만날까요?</h2><p class="msg" style="min-height:0">날짜와 시간을 골라주세요 🗓️</p>
  <label for="d">날짜</label><input type="date" id="d" min="${min}" value="${state.date}">
  <label for="t">시간</label><input type="time" id="t" step="900" value="${state.time}">
  <div class="row" style="margin-top:20px"><button class="btn pri" id="go" disabled>다음</button></div>`);
  const dEl=$('#d'),tEl=$('#t'),go=$('#go');
  const chk=()=>{go.disabled=!(dEl.value&&tEl.value)};
  dEl.oninput=tEl.oninput=chk;chk();
  go.onclick=()=>{state.date=dEl.value;state.time=tEl.value;pickConcept()};
}

const concepts=[['🎬','영화보기'],['🍽️','물셰프의 요리 먹기'],['🌊','해운대 산책하기'],['🍺','맥주 마시기'],['🎉','와카캌하기'],['🌆','전포 데이트하기']];
function pickConcept(){
  const c=card(`<h2>어떤 데이트가 좋아요?</h2><p class="msg" style="min-height:0;margin-bottom:0">여러 개 골라도 돼요 ♥</p>
  <div class="chips">${concepts.map(([e,t],i)=>`<button class="chip" aria-pressed="${state.picks.includes(t)}" data-t="${t}"><span class="e">${e}</span>${t}</button>`).join('')}</div>
  <div class="row"><button class="btn pri" id="fin" disabled>이걸로 정했어요</button></div>`);
  const fin=$('#fin');
  const sync=()=>{fin.disabled=!state.picks.length};sync();
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t,on=b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed',on);
    state.picks=on?[...state.picks,t]:state.picks.filter(x=>x!==t);sync();
  });
  fin.onclick=finale;
}

/* ---------- finale ---------- */
function fmt(){
  const [y,m,d]=state.date.split('-').map(Number),[hh,mm]=state.time.split(':').map(Number);
  const ds=new Date(y,m-1,d).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  const ts=new Date(2000,0,1,hh,mm).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
  return {ds,ts};
}
function finale(){
  const {ds,ts}=fmt();
  ov.className='overlay final';
  ov.innerHTML=`<h1>그럼 건강해진<br>또또와 만나요! <span class="h">♥</span></h1>
  <div class="sum">📅 ${ds} ${ts}<br>${state.picks.join(' · ')}</div>
  <button class="btn" id="cp">선택 결과 복사하기</button>`;
  $('#cp').onclick=async e=>{
    const txt=`또또와의 데이트 ♥\n${ds} ${ts}\n${state.picks.join(', ')}`;
    try{await navigator.clipboard.writeText(txt);e.target.textContent='복사했어요! 💌'}
    catch(_){e.target.textContent='복사가 안 되면 화면을 캡처해서 보내주세요 📸'}
  };
  confetti();
}

function confetti(){
  const cv=document.createElement('canvas');document.body.appendChild(cv);
  const ctx=cv.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2);
  const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  size();addEventListener('resize',size);
  const cols=['#ff7a9c','#ffcf70','#7fd1c3','#b9b5d3','#fff4f6','#ff9f68'];
  const ps=[];
  function burst(x,dir,n){
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+dir*(Math.random()*.9),v=11+Math.random()*13;
      ps.push({x,y:H,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:8+Math.random()*12,c:cols[i%cols.length],t:Math.random()<.4?'h':(Math.random()<.5?'r':'o'),life:0});
    }
  }
  function rain(){ps.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*1.5,vy:1.5+Math.random()*2.5,r:0,vr:(Math.random()-.5)*.1,s:14+Math.random()*16,c:cols[(Math.random()*3)|0],t:'h',life:0})}
  const q=reduce?.3:1;
  burst(W*.1,1,Math.round(90*q));burst(W*.9,-1,Math.round(90*q));
  setTimeout(()=>{burst(W*.5,.001,Math.round(80*q));burst(W*.2,1,Math.round(60*q));burst(W*.8,-1,Math.round(60*q))},900);
  setTimeout(()=>{burst(W*.1,1,Math.round(60*q));burst(W*.9,-1,Math.round(60*q))},2400);
  let last=0;
  (function tick(t){
    ctx.clearRect(0,0,W,H);
    if(!reduce&&t-last>140&&ps.length<260){rain();last=t}
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      if(p.y>H+40){ps.splice(i,1);continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.t==='h'){ctx.font=p.s*1.6+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',0,0)}
      else if(p.t==='r')ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else{ctx.beginPath();ctx.arc(0,0,p.s/3,0,6.28);ctx.fill()}
      ctx.restore();
    }
    requestAnimationFrame(tick);
  })(0);
}

(document.fonts&&document.fonts.ready?document.fonts.ready.catch(()=>{}):Promise.resolve()).then(()=>setTimeout(start,300));
</script>
</body>
</html>
